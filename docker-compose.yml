# Brings up the backend (API, :8000) and frontend (UI, :3000) together.
# Copy .env.example to .env and fill in credentials before running:
#   cp .env.example .env && docker compose up --build

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      # Optional: only needed for Jira/AI features. Copy .env.example to .env.
      - path: .env
        required: false
    volumes:
      # Persist the contract registry and audit snapshots on the host so they
      # survive container restarts and can be shared between teams.
      - ./backend/contracts:/app/contracts
      - ./backend/snapshots:/app/snapshots

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
